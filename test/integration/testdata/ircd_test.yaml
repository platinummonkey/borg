# Minimal Ergo (ergochat) configuration for Podman-based E2E tests.
# TLS certs are expected at /tls/cert.pem and /tls/key.pem.

network:
  name: TestNet

server:
  name: test.irc.local
  listeners:
    ":6697":
      tls:
        cert: /tls/cert.pem
        key: /tls/key.pem
  max-sendq: 96k
  ip-limits:
    count: false
    throttle: false

accounts:
  registration:
    enabled: true
    allow-before-connect: true
    throttling:
      enabled: false
    bcrypt-cost: 4
    email-verification:
      enabled: false
  authentication-enabled: true
  multiclient:
    enabled: true
    allowed-by-default: true
    always-on: opt-in
  login-throttling:
    enabled: false

channels:
  registration:
    enabled: true

history:
  enabled: false

limits:
  nicklen: 32
  channellen: 64
  topiclen: 390
  monitor-entries: 100
  whowas-entries: 100
  chan-list-filter: 100
  linelen:
    tags: 2048
    rest: 2048

fakelag:
  enabled: false

roleplay:
  enabled: false

oper-classes:
  local-oper:
    title: Local Operator

opers: {}
