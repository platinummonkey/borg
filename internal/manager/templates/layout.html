{{define "layout"}}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Manager</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: monospace; background: #1a1a2e; color: #e0e0e0; display: flex; min-height: 100vh; }
.sidebar { width: 200px; background: #16213e; border-right: 1px solid #0f3460; padding: 16px; flex-shrink: 0; }
.sidebar .logo { color: #00d4ff; margin-bottom: 24px; font-size: 16px; }
.sidebar a { display: block; color: #e0e0e0; text-decoration: none; padding: 8px 12px; margin: 2px 0; border-radius: 4px; }
.sidebar a:hover { background: #0f3460; }
.content { flex: 1; padding: 24px; overflow-x: auto; }
h2 { color: #00d4ff; margin-bottom: 16px; }
h3 { color: #00d4ff; margin: 16px 0 8px; font-size: 14px; }
.metrics-row { display: flex; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
.metric-card { background: #16213e; border: 1px solid #0f3460; border-radius: 6px; padding: 12px 16px; min-width: 120px; }
.metric-value { font-size: 24px; font-weight: bold; color: #00d4ff; }
.metric-label { font-size: 11px; color: #888; margin-top: 4px; }
table { width: 100%; border-collapse: collapse; font-size: 12px; margin-bottom: 16px; }
th { text-align: left; color: #00d4ff; padding: 6px 8px; border-bottom: 1px solid #0f3460; }
td { padding: 6px 8px; border-bottom: 1px solid #0f3460; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 3px; font-size: 11px; }
.badge-online { background: #00ff88; color: #000; }
.badge-offline { background: #ff4444; color: #fff; }
.badge-stopped { background: #666; color: #fff; }
.btn { background: #00d4ff; color: #000; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-family: monospace; font-weight: bold; }
.btn:hover { background: #00b8d4; }
.btn-danger { background: #ff4444; }
.btn-danger:hover { background: #cc3333; }
.form-group { margin-bottom: 12px; }
.form-group label { display: block; color: #888; margin-bottom: 4px; font-size: 12px; }
.form-group input, .form-group select { background: #0f3460; border: 1px solid #1a1a4e; color: #e0e0e0; padding: 6px 10px; border-radius: 4px; width: 100%; max-width: 400px; font-family: monospace; }
.kanban { display: flex; gap: 16px; overflow-x: auto; }
.kanban-column { background: #16213e; border: 1px solid #0f3460; border-radius: 6px; padding: 12px; min-width: 200px; flex-shrink: 0; }
.kanban-column h4 { color: #00d4ff; margin-bottom: 8px; font-size: 12px; text-transform: uppercase; }
.task-card { background: #1a1a2e; border: 1px solid #0f3460; border-radius: 4px; padding: 8px; margin-bottom: 8px; font-size: 11px; }
.activity-feed { max-height: 300px; overflow-y: auto; font-size: 11px; }
.activity-entry { padding: 4px 0; border-bottom: 1px solid #0f3460; }
</style>
</head>
<body>
<nav class="sidebar">
  <h1 class="logo">Agent Manager</h1>
  <a href="/">Dashboard</a>
  <a href="/spawn">Spawn Agent</a>
  <a href="/costs">Costs</a>
  <a href="/taskboard">Task Board</a>
</nav>
<main class="content">
{{template "page-content" .}}
</main>
<script>
class AgentWS {
  constructor() { this.handlers = {}; this.connect(); }
  connect() {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    this.es = new EventSource('/ws');
    this.es.onmessage = (e) => {
      try {
        const msg = JSON.parse(e.data);
        (this.handlers[msg.type] || []).forEach(fn => fn(msg.payload));
      } catch(err) {}
    };
    this.es.onerror = () => {
      this.es.close();
      setTimeout(() => this.connect(), 3000);
    };
  }
  on(type, handler) {
    (this.handlers[type] = this.handlers[type] || []).push(handler);
  }
}
const ws = new AgentWS();
async function fetchJSON(url) { return (await fetch(url)).json(); }
function esc(s) { const d = document.createElement('div'); d.textContent = String(s || ''); return d.innerHTML; }
</script>
{{template "page-scripts" .}}
</body>
</html>{{end}}
