{{define "page-content"}}
<h2>Dashboard</h2>
<div id="metrics-row" class="metrics-row"></div>
<div id="agent-table"></div>
<h3>Activity Feed</h3>
<div id="activity-feed" class="activity-feed"></div>
<a href="/spawn" class="btn" style="margin-top:12px">Spawn Agent</a>
{{end}}
{{define "page-scripts"}}
<script>
function createMetricCard(value, label) {
  const card = document.createElement('div');
  card.className = 'metric-card';
  const v = document.createElement('div');
  v.className = 'metric-value';
  v.textContent = value;
  const l = document.createElement('div');
  l.className = 'metric-label';
  l.textContent = label;
  card.appendChild(v);
  card.appendChild(l);
  return card;
}

function createTable(headers, rows) {
  const table = document.createElement('table');
  const thead = document.createElement('tr');
  headers.forEach(h => {
    const th = document.createElement('th');
    th.textContent = h;
    thead.appendChild(th);
  });
  table.appendChild(thead);
  rows.forEach(row => {
    const tr = document.createElement('tr');
    row.forEach(cell => {
      const td = document.createElement('td');
      if (typeof cell === 'object' && cell.el) {
        td.appendChild(cell.el);
      } else {
        td.textContent = cell;
      }
      tr.appendChild(td);
    });
    table.appendChild(tr);
  });
  return table;
}

async function refreshDashboard() {
  try {
    const [agents, costs, tasks, messages] = await Promise.all([
      fetchJSON('/api/agents'), fetchJSON('/api/costs'),
      fetchJSON('/api/tasks'), fetchJSON('/api/messages')
    ]);

    const mr = document.getElementById('metrics-row');
    mr.replaceChildren();
    const online = agents.filter(a => a.status === 'online').length;
    const activeTasks = tasks.filter(t => t.Status === 'started').length;
    mr.appendChild(createMetricCard(agents.length, 'Total Agents'));
    mr.appendChild(createMetricCard(online, 'Online'));
    mr.appendChild(createMetricCard(activeTasks, 'Active Tasks'));
    mr.appendChild(createMetricCard('$' + (costs.total_cost_usd || 0).toFixed(4), 'Total Cost'));

    const at = document.getElementById('agent-table');
    at.replaceChildren();
    if (!agents.length) {
      const p = document.createElement('p');
      p.textContent = 'No agents registered';
      at.appendChild(p);
    } else {
      const rows = agents.map(a => {
        const badge = document.createElement('span');
        badge.className = 'badge ' + (a.status === 'online' ? 'badge-online' : a.status === 'stopped' ? 'badge-stopped' : 'badge-offline');
        badge.textContent = a.status;

        const link = document.createElement('a');
        link.href = '/agents/' + encodeURIComponent(a.nick);
        link.textContent = a.nick;

        const costStr = a.cost_summary ? '$' + a.cost_summary.total_cost_usd.toFixed(4) : '-';
        const actionCell = document.createElement('span');
        if (a.instance) {
          const btn = document.createElement('button');
          btn.className = 'btn btn-danger';
          btn.textContent = 'Stop';
          btn.addEventListener('click', () => stopAgent(a.nick));
          actionCell.appendChild(btn);
        }

        return [
          {el: link}, {el: badge}, a.source || '-', a.current_task || '-',
          (a.channels || []).join(', '), costStr, {el: actionCell}
        ];
      });
      at.appendChild(createTable(['Nick','Status','Source','Task','Channels','Cost','Actions'], rows));
    }

    const af = document.getElementById('activity-feed');
    af.replaceChildren();
    messages.slice(-50).reverse().forEach(m => {
      const entry = document.createElement('div');
      entry.className = 'activity-entry';
      const time = document.createElement('span');
      time.style.color = '#888';
      time.textContent = new Date(m.timestamp).toLocaleTimeString();
      const action = document.createElement('span');
      action.style.color = '#00d4ff';
      action.textContent = ' ' + m.action + ' ';
      entry.appendChild(time);
      entry.appendChild(action);
      entry.appendChild(document.createTextNode(m.nick + ' ' + m.channel + ' ' + (m.raw || '').substring(0, 60)));
      af.appendChild(entry);
    });
  } catch(e) { console.error(e); }
}

async function stopAgent(nick) {
  if (!confirm('Stop agent ' + nick + '?')) return;
  await fetch('/api/agents/' + encodeURIComponent(nick) + '/stop', {method: 'POST'});
  refreshDashboard();
}

refreshDashboard();
setInterval(refreshDashboard, 5000);
ws.on('agent_update', refreshDashboard);
ws.on('message', refreshDashboard);
</script>
{{end}}
